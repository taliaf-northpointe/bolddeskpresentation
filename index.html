<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nora Presents BoldDesk</title>
<style>
  /* Without this, any card with padding is wider than its declared width,
     which is how Scene 4's ticket ended up running off the right edge. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #101418; overflow: hidden;
               font-family: Lato, "Segoe UI", system-ui, sans-serif; }
  #fit { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px;
           overflow: hidden; background: #FBFDFE; }
  .scene { position: absolute; inset: 0; transform-origin: 50% 50%; display: none; }
  .scene.on { display: block; }
  body.render #fit { display: block; }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px 14px;
        background: rgba(16,20,24,.94); color: #cfd8dd; font-size: 13px;
        display: flex; gap: 12px; align-items: center; border-top: 1px solid #2a3238; }
  body.render #ui { display: none; }
  #ui button { background: #0086B1; color: #fff; border: 0; padding: 7px 15px;
               border-radius: 6px; cursor: pointer; font: inherit; font-weight: 700; }
  #ui select { background: #1b2228; color: #cfd8dd; border: 1px solid #2a3238;
               border-radius: 5px; padding: 6px 8px; font: inherit; }
  #ui input[type=range] { flex: 1; }
  #ui code { color: #7fd4ef; white-space: nowrap; }
  #ui label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
</style>
</head>
<body>
<div id="fit"><div id="stage"></div></div>

<div id="ui">
  <button id="play">Play</button>
  <select id="pick"></select>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0">
  <code id="tread">0.00</code>
  <label><input id="ccToggle" type="checkbox"> cc</label>
  <code id="dbg"></code>
</div>

<script type="module">
/* ===================================================================
   Master timeline.

   Scenes are laid end to end. Each is handed a LOCAL time starting at
   zero, so it can be built and previewed on its own and then dropped
   into the film without touching its code. The renderer drives the same
   window.__setTime, so the preview and the output file cannot disagree
   about what a given moment looks like.

     ?scene=2        preview one scene in isolation
     ?cc=1           captions on
     ?mode=render    strip the UI and wait to be driven frame by frame
=================================================================== */

import * as s01 from './scenes/scene01.js';
import * as s02 from './scenes/scene02.js';
import * as s03 from './scenes/scene03.js';
import * as s04 from './scenes/scene04.js';

const SCENES = [s01, s02, s03, s04];

const params = new URLSearchParams(location.search);
const RENDER = params.get('mode') === 'render';
const ccOn   = params.get('cc') === '1';
const only   = params.get('scene') ? parseInt(params.get('scene'), 10) : null;
if (RENDER) document.body.classList.add('render');

const stage = document.getElementById('stage');

/* ---------- mount ------------------------------------------------- */
const active = only ? [SCENES[only - 1]] : SCENES;
let clock = 0;
const mounted = active.map(sc => {
  const rootEl = document.createElement('div');
  rootEl.className = 'scene';
  rootEl.id = sc.id;
  stage.appendChild(rootEl);
  const api = sc.build(rootEl) || {};
  const entry = { sc, rootEl, api, t0: clock, track: [] };
  clock += sc.dur;
  return entry;
});
const TOTAL = clock;

/* ---------- viseme tracks ----------------------------------------- */
/* Chromium blocks fetch() from a file:// origin, so this page has to be
   served. scripts/render.py starts a local server for exactly that
   reason; for preview use `python3 -m http.server`. */
const trackNote = [];
await Promise.all(mounted.map(async m => {
  if (!m.sc.visemes) return;
  try {
    const r = await fetch(m.sc.visemes, { cache: 'no-store' });
    const j = await r.json();
    if (Array.isArray(j) && j.length) {
      m.track = j.slice().sort((a, b) => a.t - b.t);
      trackNote.push(`${m.sc.id}:${j.length}`);
    }
  } catch (e) {
    trackNote.push(`${m.sc.id}:MISSING`);
  }
}));
window.__trackNote = trackNote.join(' ');

/* ---------- captions --------------------------------------------- */
mounted.forEach(m => m.api.cc && m.api.cc.setVisible(ccOn));
document.getElementById('ccToggle').checked = ccOn;
document.getElementById('ccToggle').addEventListener('change', e =>
  mounted.forEach(m => m.api.cc && m.api.cc.setVisible(e.target.checked)));

/* ---------- render ----------------------------------------------- */
function render(t) {
  t = Math.max(0, Math.min(t, TOTAL));
  let cur = mounted[0];
  for (const m of mounted) if (t >= m.t0) cur = m;
  mounted.forEach(m => m.rootEl.classList.toggle('on', m === cur));
  const extra = cur.sc.render(t - cur.t0, cur.track);
  document.getElementById('tread').textContent = t.toFixed(2);
  document.getElementById('dbg').textContent =
    `${cur.sc.id} ${(t - cur.t0).toFixed(2)}s` + (extra ? ` · ${extra}` : '');
}

window.__setTime = t => {
  render(t);
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
};
window.__duration = TOTAL;
window.__scenes = mounted.map(m => ({ id: m.sc.id, t0: m.t0, dur: m.sc.dur }));

/* ---------- preview ---------------------------------------------- */
const scrub = document.getElementById('scrub');
const btn = document.getElementById('play');
const pick = document.getElementById('pick');
scrub.max = TOTAL;

pick.innerHTML = '<option value="-1">whole film</option>' +
  mounted.map((m, i) => `<option value="${i}">${i + 1}. ${m.sc.title}</option>`).join('');
pick.addEventListener('change', () => {
  const i = parseInt(pick.value, 10);
  scrub.value = i < 0 ? 0 : mounted[i].t0;
  render(parseFloat(scrub.value));
});

let playing = false, t0 = 0, base = 0;
function tick(now) {
  if (!playing) return;
  const t = base + (now - t0) / 1000;
  if (t >= TOTAL) { playing = false; btn.textContent = 'Play'; render(TOTAL); return; }
  render(t); scrub.value = t;
  requestAnimationFrame(tick);
}
btn.addEventListener('click', () => {
  if (playing) { playing = false; btn.textContent = 'Play'; return; }
  if (parseFloat(scrub.value) >= TOTAL - 0.01) scrub.value = 0;
  base = parseFloat(scrub.value); playing = true; btn.textContent = 'Pause';
  requestAnimationFrame(n => { t0 = n; tick(n); });
});
scrub.addEventListener('input', () => {
  playing = false; btn.textContent = 'Play'; render(parseFloat(scrub.value));
});

function fitStage() {
  if (RENDER) return;
  const s = Math.min(window.innerWidth / 1920, (window.innerHeight - 70) / 1080);
  const f = document.getElementById('fit');
  f.style.transform = `scale(${s})`;
  f.style.transformOrigin = '50% 0';
}
window.addEventListener('resize', fitStage);
fitStage();
render(0);
window.__ready = true;
</script>
</body>
</html>
